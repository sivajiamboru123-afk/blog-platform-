<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WriteSpace Blog</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">WriteSpace<span>.</span></a><nav><button id="home">Home</button><button id="write">Write a post</button></nav><div id="account"></div></header><main><section class="hero"><small>A SPACE FOR YOUR IDEAS</small><h1>Stories worth<br><i>sharing.</i></h1><p>Read thoughtful posts, share your perspective, and join the conversation.</p></section><section id="auth" class="panel hide"><button class="close" id="closeAuth">×</button><h2 id="authTitle">Log in</h2><form id="authForm"><input id="name" placeholder="Your name" class="hide"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (6+ characters)" required><button class="primary" id="authSubmit">Log in</button></form><p id="switch"></p><p id="authMsg"></p></section><section id="writer" class="panel hide"><button class="close" id="closeWriter">×</button><h2>Create a post</h2><form id="postForm"><input id="title" placeholder="Post title" minlength="3" required><textarea id="body" placeholder="Write your story..." minlength="10" required></textarea><button class="primary">Publish</button></form><p id="postMsg"></p></section><h2 class="latest">Latest stories <span id="count"></span></h2><section id="posts">Loading...</section></main><footer>WriteSpace · Share ideas. Start conversations.</footer><script src="/app.js"></script></body></html>
